name: whyitbroke
description: Distill a command's failure output into compact, clickable GitHub Actions annotations
inputs:
  command:
    description: Shell command to run and summarize
    required: true
  version:
    description: >-
      whyitbroke npm version to use. Pinned by default: a floating "latest" means
      a release you have not reviewed can change your CI output.
    required: false
    default: 0.5.0
  working-directory:
    description: Directory in which to run the command
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Run command with whyitbroke
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        WHYITBROKE_COMMAND: ${{ inputs.command }}
        WHYITBROKE_VERSION: ${{ inputs.version }}
      run: |
        set +e
        npx --yes "whyitbroke@${WHYITBROKE_VERSION}" \
          --format github -- bash -eo pipefail -c "$WHYITBROKE_COMMAND"
        status=$?
        exit "$status"
